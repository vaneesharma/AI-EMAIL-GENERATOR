<div class="form-group" {% if field.name == 'custom_purpose' %}id="customPurposeGroup"{% endif %}>
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small class="help">{{ field.help_text|safe }}</small>{% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
